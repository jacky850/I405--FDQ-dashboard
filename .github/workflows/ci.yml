name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The clean-install path a new user follows, from REPRODUCE.md. If this
      # step needs PYTHONPATH set by hand, the install is broken.
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]"

      - name: Import the package
        run: python -c "import fdqbench; print(fdqbench.__file__)"

      - name: Unit and regression tests
        run: pytest -q

      # The published example: lambda, mu -> Q, travel time, speed on one I-395
      # and one I-66 link, checked against the committed output. Exits non-zero
      # on any difference above 1e-9.
      - name: Reproduce the NVTA queue kernel example
        run: python nvta_queue_kernel/reproduce.py

      # Everything downstream of the committed leave-one-week-out results must
      # regenerate, and the dashboard must still match what was generated.
      - name: Regenerate the multiweek outputs and dashboard payload
        run: |
          python scripts/build_i405_observed_vs_inferred_d_v.py
          python scripts/run_i405_forward_projection_speed.py
          python scripts/build_i405_multiweek_dashboard_data.py

      - name: Dashboard matches the regenerated results
        run: pytest -q tests/test_dashboard_metrics.py

      # Regenerating must be a no-op on a clean tree. A diff here means a
      # committed output no longer matches the code that claims to produce it.
      - name: Committed outputs are up to date
        run: |
          if ! git diff --quiet; then
            echo "Regeneration changed committed files:"
            git diff --stat
            exit 1
          fi

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No personal absolute path may reach a published artefact. The dashboard
      # payload is served on GitHub Pages, so this is a disclosure check as much
      # as a reproducibility one.
      #
      # Artefacts must be clean and the check fails on any hit. Source files are
      # listed but do not fail the build yet: 15 older scripts still carry one,
      # they are tracked in docs/REPORT_CODE_TRACEABILITY.md, and none of them is
      # on the path any published result is regenerated by.
      - name: No personal paths in generated outputs or the dashboard payload
        run: |
          python scripts/scrub_personal_paths.py --check > report.txt 2>&1 || true
          cat report.txt
          if grep -qE 'would rewrite [1-9][0-9]* artefact' report.txt; then
            echo "::error::A personal absolute path is committed in a generated artefact."
            exit 1
          fi
          echo "artefacts clean"
