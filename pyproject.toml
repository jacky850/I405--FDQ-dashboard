[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdqbench"
version = "0.2.0"
description = "Single-link FDQueue calibration, reference reconstruction, QA/QC, and OpenDTA export"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
fdqbench = "fdqbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
